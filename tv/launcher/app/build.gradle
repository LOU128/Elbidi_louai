plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elbidi.horizon'
    compileSdk 34

    defaultConfig {
        applicationId 'com.elbidi.horizon'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Signé avec la clé de debug : suffisant pour une installation perso via adb.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
